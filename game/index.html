<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 1.6 Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div id="crosshair">+</div>
            <div id="health">❤️ 100</div>
            <div id="ammo">🔫 30 / 90</div>
            <div id="score">Счёт: 0</div>
            <div id="wave">Волна: 1</div>
        </div>
        
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>COUNTER-STRIKE 1.6 CLONE</h1>
            <p>Управление:</p>
            <ul>
                <li>WASD - движение</li>
                <li>Мышь - обзор</li>
                <li>ЛКМ - стрельба</li>
                <li>R - перезарядка</li>
                <li>Shift - бег</li>
                <li>ESC - пауза</li>
            </ul>
            <button id="start-btn">НАЧАТЬ ИГРУ</button>
        </div>
        
        <!-- Pause Screen -->
        <div id="pause-screen" class="screen hidden">
            <h1>ПАУЗА</h1>
            <button id="resume-btn">ПРОДОЛЖИТЬ</button>
            <button id="restart-btn">ЗАНОВО</button>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <h1>ИГРА ОКОНЧЕНА</h1>
            <p>Ваш счёт: <span id="final-score">0</span></p>
            <p>Волн пройдено: <span id="final-wave">0</span></p>
            <h2>Рекорды:</h2>
            <ol id="highscores"></ol>
            <button id="play-again-btn">ИГРАТЬ СНОВА</button>
        </div>
        
        <!-- Damage Overlay -->
        <div id="damage-overlay"></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
